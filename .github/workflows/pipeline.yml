name: CI and production deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  attestations: write
  id-token: write

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma client
        run: pnpm exec prisma generate
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm type-check
      - name: Production build
        run: pnpm build

  container:
    name: Build, scan and publish image
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define immutable image tag
        id: image
        run: echo "image=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build image for validation
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and publish immutable image
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # trivy-action builds SARIF reports with all severities regardless of the
      # `severity` input (so GitHub code scanning can triage the full picture),
      # but still applies `exit-code` to that unfiltered set. That silently
      # turned any MEDIUM/LOW finding into a build-blocking failure. The gate
      # and the report are therefore two separate scans: the table-format scan
      # enforces CRITICAL/HIGH only, the SARIF one never fails the build and
      # exists purely to populate the Security tab.
      - name: Gate on critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Build vulnerability report for the Security tab
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
      - name: Upload vulnerability report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
      - name: Attest published image provenance
        if: github.event_name != 'pull_request' && success()
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy-production:
    name: Deploy exact image to production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: container
    # This runner is installed on the production server. Keeping CI on GitHub
    # runners and deployment here avoids opening SSH access for Actions.
    runs-on: self-hosted
    environment: production
    steps:
      - name: Pull, migrate, start and health-check
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          APP_IMAGE: ${{ needs.container.outputs.image }}
        run: |
          set -Eeuo pipefail
          cd "$DEPLOY_PATH"
          printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          export APP_IMAGE
          docker compose -f docker-compose.production.yml pull app
          docker compose -f docker-compose.production.yml run --rm --no-deps app npx prisma migrate deploy
          docker compose -f docker-compose.production.yml up -d --no-build --remove-orphans
          for attempt in $(seq 1 18); do
            if docker compose -f docker-compose.production.yml exec -T app node -e "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              docker image prune -f
              exit 0
            fi
            sleep 10
          done
          docker compose -f docker-compose.production.yml logs --tail=200 app
          exit 1
