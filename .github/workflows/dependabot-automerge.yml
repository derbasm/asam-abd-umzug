name: Merge verified Dependabot updates

on:
  workflow_run:
    workflows: [CI and production deployment]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    # workflow_run has no pull request for direct pushes; only Dependabot pull
    # requests are eligible, and no untrusted pull-request code is checked out.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the verified Dependabot pull request
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${run.head_branch}`,
            });
            const pull = pulls.find((item) => item.head.sha === run.head_sha);
            if (!pull || pull.user.login !== 'dependabot[bot]') {
              core.notice('No eligible Dependabot pull request found.');
              return;
            }
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              merge_method: 'squash',
            });
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${pull.head.ref}`,
            }).catch(() => core.notice('Branch was already deleted.'));
