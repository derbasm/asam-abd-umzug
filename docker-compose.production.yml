services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE muss auf einen unveränderlichen GHCR-SHA-Tag zeigen}
    container_name: umzug_app
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    user: "1001:1001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev
      - /app/.next/cache:rw,nosuid,nodev,uid=1001,gid=1001
    networks: [app-network]

  postgres:
    image: postgres:15-alpine
    container_name: umzug_postgres
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks: [app-network]

volumes:
  postgres_data:

networks:
  app-network:
